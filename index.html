        /* Variáveis de Cores e Estilo */
        :root {
            --cor-fundo: #f4f7f6;
            --cor-texto: #333333;
            --cor-primaria: #2c3e50;
            --cor-destaque: #3498db;
            --cor-card: #ffffff;
            --fonte-base: 100%; /* Base para o controle de acessibilidade */
        }

        /* Reset e Configurações Básicas */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            font-size: var(--fonte-base);
            line-height: 1.6;
            transition: font-size 0.3s ease; /* Transição suave para o tamanho da fonte */
        }

        /* Painel de Acessibilidade */
        .acessibilidade-panel {
            background-color: var(--cor-primaria);
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

            color: #fff;
            font-size: 0.9em;
            font-weight: bold;
        }
